<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mud2026 · Three.js prototype</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <canvas id="world"></canvas>
    <section id="room-panel">
      <div class="eyebrow">PENDELHAVEN · THREE.JS SPIKE</div>
      <h1 id="title">Loading…</h1>
      <p id="description"></p>
      <div id="exits"></div>
    </section>
    <aside id="developer"></aside>
    <aside id="player-status"></aside>
    <nav id="game-menu" aria-label="Game menus">
      <button type="button" data-open-panel="inventory">Pack <kbd>I</kbd></button>
      <button type="button" data-open-panel="character">Character <kbd>C</kbd></button>
      <button type="button" data-open-panel="spells">Spells <kbd>K</kbd></button>
      <button type="button" id="control-mode">Commands <kbd>Enter</kbd></button>
    </nav>
    <section id="game-panel" hidden aria-modal="true" role="dialog">
      <header><div><div class="eyebrow">ADVENTURER</div><h2 id="game-panel-title">Inventory</h2></div><button type="button" id="game-panel-close" aria-label="Close menu">×</button></header>
      <div id="game-panel-content"></div>
    </section>
    <section id="character-creation">
      <form id="character-form">
        <div class="eyebrow">CREATE YOUR ADVENTURER</div>
        <h2>Enter Pendelhaven</h2>
        <label>Name <input id="character-name" maxlength="20" value="Adventurer" /></label>
        <div class="creation-grid">
          <label>Race <select id="character-race"><option>Human</option><option>Elf</option><option>Dwarf</option><option>Gnome</option><option>Giant</option><option>Fairfolk</option></select></label>
          <label>Walk of life <select id="character-class"><option>Warrior</option><option>Scholar</option><option>Gypsy</option><option>Priest</option><option>Mage</option><option>Archtypical</option></select></label>
        </div>
        <p id="character-preview"></p>
        <button type="submit">Begin adventure</button>
      </form>
    </section>
    <div id="reticle">+</div>
    <section id="interaction-panel" hidden><h2 id="interaction-title"></h2><div id="interaction-text"></div></section>
    <aside id="tutorial" hidden></aside>
    <div id="interaction-prompt" hidden></div>
    <section id="proximity-actions" hidden><div class="eyebrow">NEARBY</div><div id="proximity-buttons"></div></section>
    <div id="help">Mouse look · WASD · Shift run · E interact · I pack · C character · K spells · Enter commands · tap V camera · hold V + wheel zoom</div>
    <form id="command-form">
      <span>&gt;</span><input id="command" autocomplete="off" spellcheck="false" placeholder="look, examine old man, read parchment, west, diagnose…" /><button type="submit">Go</button>
    </form>
    <div id="error" hidden></div>
  </body>
</html>
